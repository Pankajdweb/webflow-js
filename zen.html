<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Circular Slider</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #fff;
        font-family: Arial, sans-serif;
        padding: 30px 0;
      }

      .label {
        text-align: center;
        font-size: 40px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .container {
        position: relative;
        max-width: 500px;
        margin: auto;
      }

      .wrapper {
        position: relative;
        width: 300px;
        height: 300px;
        margin: auto;
      }

      .item {
        width: 50px;
        height: 50px;
        color: white;
        text-align: center;
        line-height: 50px;
        font-size: 20px;
        border-radius: 50%;
        background: red;
        position: absolute;
        cursor: pointer;
        user-select: none;
        transition: 0.3s;
      }

      .item.active {
        background: blue;
        transform: scale(1.1);
      }

      svg {
        width: 300px;
        height: 300px;
        overflow: visible;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -1;
      }

      .st0 {
        fill: none;
        stroke: #000;
        stroke-width: 2;
      }

      .start {
        position: absolute;
        top: 50%;
        right: -80px;
      }

      .buttons {
        text-align: center;
        margin-top: 30px;
      }

      button {
        padding: 10px 20px;
        margin: 0 5px;
        cursor: pointer;
      }

      .pagination {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 25px;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ccc;
        cursor: pointer;
        transition: 0.3s;
      }

      .dot.active {
        background: blue;
        transform: scale(1.2);
      }
    </style>
  </head>

  <body>
    <div class="label">1</div>

    <div class="container">
      <div class="wrapper">
        <div class="item active">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>

        <svg viewBox="0 0 300 300">
          <circle id="holder" class="st0" cx="151" cy="151" r="150" />
        </svg>
      </div>

      <div class="start">← Active</div>
    </div>

    <div class="buttons">
      <button id="prev">Prev</button>
      <button id="next">Next</button>
    </div>

    <div class="pagination"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/MotionPathPlugin.min.js"></script>

    <script>
      const labelData = {
        a1: 1,
        a2: 2,
        a3: 3,
        a4: 4,
        a5: 5,
        a6: 6,
        a7: 7,
        a8: 8,
      };

      const labelValues = Object.values(labelData);

      gsap.registerPlugin(MotionPathPlugin);

      const circlePath = MotionPathPlugin.convertToPath(
        "#holder",
        false,
      )[0];

      circlePath.id = "circlePath";

      document.querySelector("svg").prepend(circlePath);

      let items = gsap.utils.toArray(".item"),
        numItems = items.length,
        itemStep = 1 / numItems,
        wrapProgress = gsap.utils.wrap(0, 1),
        snap = gsap.utils.snap(itemStep),
        wrapTracker = gsap.utils.wrap(0, numItems),
        tracker = { item: 0 };

      const label = document.querySelector(".label");
      const pagination = document.querySelector(".pagination");

      // CREATE PAGINATION
      items.forEach((_, i) => {
        const dot = document.createElement("div");

        dot.classList.add("dot");

        if (i === 0) {
          dot.classList.add("active");
        }

        dot.addEventListener("click", () => {
          goToIndex(i);
        });

        pagination.appendChild(dot);
      });

      const dots = gsap.utils.toArray(".dot");

      // POSITION ITEMS
      gsap.set(items, {
        motionPath: {
          path: circlePath,
          align: circlePath,
          alignOrigin: [0.5, 0.5],
          end: (i) => i / items.length,
        },
      });

      // TIMELINE
      const tl = gsap.timeline({
        paused: true,
        reversed: true,
      });

      tl.to(".wrapper", {
        rotation: 360,
        transformOrigin: "center",
        duration: 1,
        ease: "none",
      });

      tl.to(
        items,
        {
          rotation: "-=360",
          transformOrigin: "center",
          duration: 1,
          ease: "none",
        },
        0,
      );

      tl.to(
        tracker,
        {
          item: numItems,
          duration: 1,
          ease: "none",
          modifiers: {
            item(value) {
              return wrapTracker(
                numItems - Math.round(value),
              );
            },
          },
        },
        0,
      );

      // UPDATE ACTIVE UI
      function updateUI(index) {
        document
          .querySelector(".item.active")
          ?.classList.remove("active");

        document
          .querySelector(".dot.active")
          ?.classList.remove("active");

        items[index].classList.add("active");
        dots[index].classList.add("active");

        // UPDATE LABEL VALUE
        label.innerHTML = labelValues[index];
      }

      // GO TO INDEX
      function goToIndex(index) {
        let current = tracker.item;

        if (current === index) return;

        let diff = current - index;

        if (Math.abs(diff) < numItems / 2) {
          moveWheel(diff * itemStep);
        } else {
          let amt = numItems - Math.abs(diff);

          if (current > index) {
            moveWheel(amt * -itemStep);
          } else {
            moveWheel(amt * itemStep);
          }
        }
      }

      // ITEM CLICK
      items.forEach((el, i) => {
        el.addEventListener("click", () => {
          goToIndex(i);
        });
      });

      // NEXT BUTTON
      document
        .getElementById("next")
        .addEventListener("click", () => {
          moveWheel(-itemStep);
        });

      // PREV BUTTON
      document
        .getElementById("prev")
        .addEventListener("click", () => {
          moveWheel(itemStep);
        });

      // MOVE FUNCTION
      function moveWheel(amount) {
        let progress = tl.progress();

        tl.progress(
          wrapProgress(
            snap(tl.progress() + amount),
          ),
        );

        let next = tracker.item;

        tl.progress(progress);

        updateUI(next);

        gsap.to(tl, {
          progress: snap(tl.progress() + amount),
          modifiers: {
            progress: wrapProgress,
          },
          duration: 0.5,
        });
      }

      // INITIAL STATE
      updateUI(0);
    </script>
  </body>
</html>
